[project]
name = "pam-research-studio"
version = "0.11.0"
description = "Offline reference passive acoustic mapping research engine"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.4",
  "scipy==1.16.3",
  "h5py==3.15.1",
  "pydantic==2.12.3",
  "fastapi==0.162.4",
  "starlette==1.10.0",
  "uvicorn==0.38.0",
  "PyYAML==6.0.3",
  "matplotlib==3.10.7",
  "pydicom==3.0.2",
  "python-gdcm==3.2.6",
  "reportlab==5.1.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.14.3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/src/pamstudio"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
