source_kind: synthetic
warnings:
- "Experimental one-way jbubble volume-flow \u2192 j-Wave 2D coupling. An explicit\
  \ out-of-plane equivalent line length defines the 3D-to-2D conversion. FIR bandwidth\
  \ filtering, CT-derived fluid medium and no acoustic feedback. RF is 2D model pressure\
  \ divided by drive pressure; no 3D pressure equivalence or calibrated measurement."
- Receive layout uses point elements with actual array positions and angles; finite
  element width, directivity and transmit steering are not modelled.
- Experimental CT-derived 2D fluid c/rho model with thresholded HU mixture. Air/soft
  tissue are replaced by host fluid. No absorption or elastic/shear modes; homogeneous
  straight-ray receive reconstruction remains uncorrected. HU calibration is user-defined,
  not a patient-specific acoustic measurement.
- Emission-time gate truncates a source waveform.
