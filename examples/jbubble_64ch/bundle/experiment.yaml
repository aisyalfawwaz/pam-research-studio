warnings:
- Experimental jbubble Keller-Miksis dynamics with Hann sine drive, independent identical
  bubbles and quasi-acoustic spherical 3D propagation. RF is simulated emission pressure
  divided by drive pressure; plots in Pa are model predictions, not calibrated measurements.
  No bubble interactions, transmit field, attenuation or clinical inference.
- Receiver pitch exceeds half the resolved bubble-emission wavelength; harmonics may
  produce grating lobes. Consider smaller pitch or a validated receive bandpass.
- Acquisition anti-alias filtering discards some simulated bubble-emission energy;
  inspect the recorded spectral-loss fraction.
